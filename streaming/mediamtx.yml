###############################################
# MediaMTX — Drone relay server config
# Jetson pushes RTSP → this server
# Ground station pulls RTSP / WebRTC / HLS
###############################################

# RTSP — Jetson pushes and ground station pulls on port 8554
rtsp: yes
rtspAddress: :8554
rtpAddress: :8000
rtcpAddress: :8001

# SRT — alternative push for lossy LTE links
srt: yes
srtAddress: :8890

# WebRTC — ground station can watch in browser (low latency)
webrtc: yes
webrtcAddress: :8889

# HLS — fallback browser view (~5 s latency)
hls: yes
hlsAddress: :8888
hlsSegmentCount: 3
hlsSegmentDuration: 1s

logLevel: info
logDestinations: [stdout]

paths:
  drone:
    source: publisher

    # Record every push session to a separate MP4 file.
    # Each time the Jetson connects a new file is created with a timestamp name.
    # Files land in: streaming/recordings/drone/YYYY-MM-DD_HH-MM-SS.mp4
    record: yes
    recordPath: ./recordings/%path/%Y-%m-%d_%H-%M-%S
    recordFormat: fmp4          # fragmented MP4 — playable immediately, seekable
    recordSegmentDuration: 1h   # split into 1-hour segments if session is long
    recordDeleteAfter: 0s       # never auto-delete (0s = keep forever)
